<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../skin/preferences.css" />
    <link rel="stylesheet" href="../skin/passwordGenerator.css" />
    <script src="../modules/util.js"></script>
    <script src="../modules/main.js"></script>
    <script src="../modules/preferences.js"></script>
    <script src="../modules/pass.js"></script>
  </head>
  <body id="passwordGenerator">
    <fieldset>
      <p>
        <label>inputs_password_name_label</label>
        <input type="text" id="add-password-name" value="" />
      </p>
      <div class="tabbox">
        <input type="radio" name="add-password-mode" id="add-password-mode-gen">
        <label for="add-password-mode-gen">tabs_generate</label>
        <input type="radio" name="add-password-mode" id="add-password-mode-ins" checked="checked">
        <label for="add-password-mode-ins">tabs_insert</label>
        <div class="tabpanels">
          <div class="tabpanel">
            <p>
              <label>inputs_password_length_label</label>
              <input type="text" id="add-password-gen-length" value="16" />
            </p><p>
              <input type="checkbox" id="add-password-gen-symbols" checked="true" />
              <label for="add-password-gen-symbols">inputs_include_symbols_label</label>
            </p>
          </div>
          <div class="tabpanel">
            <p>
              <label>inputs_password_label</label>
              <input type="password" id="add-password-ins" value="" />
            </p><p>
              <label>inputs_password_confirmation_label</label>
              <input type="password" id="add-password-ins-confirmation" value="" />
            </p>
          </div>
        </div>
      </div>
      <p>
        <label>inputs_additional_info_label</label>
        <textarea id="add-password-info"></textarea>
      </p><p>
        <button id="add-password-button">inputs_add_password_button_label</button>
      </p>
      <div id="add-password-errors"></div>
    </fieldset>
  </body>
</html>
